name: Test Google Flights Search

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 7 * * *"
    - cron: "0 18 * * *"
    - cron: "0 19 * * *"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Check 36-hour schedule
        id: schedule_gate
        if: github.event_name == 'schedule'
        run: python schedule_gate.py

      - name: Restore flight search state
        if: github.event_name == 'workflow_dispatch' || steps.schedule_gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: .flight_state.json
          key: flight-state-v2-${{ github.run_id }}
          restore-keys: |
            flight-state-v2-

      - name: Run Flight Tracker
        if: github.event_name == 'workflow_dispatch' || steps.schedule_gate.outputs.run == 'true'
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python flight_bot.py
